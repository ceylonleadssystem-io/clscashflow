<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CeylonryPOS — Secure Support View</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0"></script><script src="../assets/supabase-firebase-compat.js?v=20260830-pos"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#171512;font-family:Arial,sans-serif}.top{background:#171512;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.top strong{font:700 24px Georgia}.top span{color:#d4aa43}.wrap{width:min(1200px,calc(100% - 30px));margin:22px auto}.notice{background:#fff8e7;border:1px solid #d7b963;padding:13px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #dedad1;border-radius:10px;padding:17px}.card small{color:#756f66;text-transform:uppercase;font-weight:bold}.card strong{display:block;font:700 25px Georgia;margin-top:8px}.panel{background:#fff;border:1px solid #dedad1;border-radius:10px;margin-top:15px;overflow:hidden}.head{padding:15px 17px;border-bottom:1px solid #dedad1}.head h2{margin:0;font:700 21px Georgia}.muted{color:#756f66;font-size:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid #e7e2da;font-size:12px}th{background:#faf9f6;color:#756f66;font-size:9px;text-transform:uppercase}.bad{color:#a5362b;padding:20px}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}.panel{overflow:auto}table{min-width:700px}}</style></head><body><header class="top"><strong>Ceylonry<span>POS</span> Support View</strong><button onclick="window.close()">Close</button></header><main class="wrap"><div class="notice"><strong>Read-only developer support session.</strong> Use this view to inspect a customer POS when investigating a bug. Sales and settings cannot be changed here.</div><div id="status" class="muted">Loading customer POS…</div><div id="app" hidden><div class="grid" id="metrics"></div><section class="panel"><div class="head"><h2>Products</h2></div><table><thead><tr><th>Name</th><th>Category</th><th>SKU</th><th>Price</th><th>Stock</th></tr></thead><tbody id="products"></tbody></table></section><section class="panel"><div class="head"><h2>Recent sales</h2></div><table><thead><tr><th>Receipt</th><th>Date</th><th>Customer</th><th>Payment</th><th>Total</th></tr></thead><tbody id="sales"></tbody></table></section><section class="panel"><div class="head"><h2>Configuration</h2></div><pre id="settings" style="padding:16px;white-space:pre-wrap"></pre></section></div></main><script>firebase.initializeApp({});const auth=firebase.auth(),uid=new URLSearchParams(location.search).get('user'),$=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(){let user=auth.currentUser;if(!user||String(user.email).toLowerCase()!=='devteam@ceylonrylabs.io')throw Error('Sign in to the POS Developer Portal first.');let token=await user.getIdToken(),res=await fetch('/.netlify/functions/pos-admin-data',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({action:'get',userId:uid})}),out=await res.json();if(!res.ok||!out.ok)throw Error(out.error||'Could not load POS.');let w=out.workspace||{},p=out.user.profile||{},sales=w.sales||[];$('metrics').innerHTML='<div class="card"><small>Business</small><strong style="font-size:18px">'+esc(p.posBusinessName||p.bizName||'—')+'</strong></div><div class="card"><small>Products</small><strong>'+(w.products||[]).length+'</strong></div><div class="card"><small>Sales</small><strong>'+sales.length+'</strong></div><div class="card"><small>Staff</small><strong>'+(w.users||[]).length+'</strong></div>';$('products').innerHTML=(w.products||[]).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.code)+'</td><td>LKR '+Number(x.price||0).toLocaleString('en-LK')+'</td><td>'+Number(x.stock||0)+' '+esc(x.unit||'')+'</td></tr>').join('')||'<tr><td colspan="5">No products.</td></tr>';$('sales').innerHTML=sales.slice(0,50).map(x=>'<tr><td>'+esc(x.receipt||x.id)+'</td><td>'+esc(x.createdAt||x.date||'')+'</td><td>'+esc(x.customerName||'Walk-in')+'</td><td>'+esc(x.payment||'')+'</td><td>LKR '+Number(x.total||0).toLocaleString('en-LK')+'</td></tr>').join('')||'<tr><td colspan="5">No sales.</td></tr>';$('settings').textContent=JSON.stringify(w.settings||{},null,2);$('status').hidden=true;$('app').hidden=false}auth.onAuthStateChanged(()=>load().catch(e=>{$('status').className='bad';$('status').textContent=e.message}));</script></body></html>
