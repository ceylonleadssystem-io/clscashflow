<!doctype html>
<html lang="en">
	<head>
		<link rel="icon" type="image/png" href="/assets/favicon.png" />
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="robots" content="noindex,nofollow,noarchive" />
		<title>Menu</title>
		<style>
			:root {
				--ink: #181512;
				--muted: #6b645c;
				--line: #e2dcd2;
				--canvas: #f6f3ee;
				--card: #ffffff;
				--accent: #8a5a12;
				--chip: #ece6db;
				--brand: #e9651b;
				--brand-ink: #1b1a18;
				--tile: #fbe9dc;
				--tile-ink: #8a3c0c;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--ink: #f2ede4;
					--muted: #a79f93;
					--line: #3a352e;
					--canvas: #151310;
					--card: #1f1c18;
					--accent: #e0b25a;
					--chip: #2b2722;
					--tile: #3a2a1d;
					--tile-ink: #f0a878;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				max-width: 100%;
				background: var(--canvas);
				color: var(--ink);
				font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
				line-height: 1.4;
			}
			header {
				background: var(--brand);
				color: var(--brand-ink);
				padding: 20px 0;
			}
			.wrap {
				max-width: 1100px;
				margin: 0 auto;
				padding: 0 16px;
			}
			h1 {
				margin: 0;
				font-size: 1.6rem;
				overflow-wrap: anywhere;
			}
			.where {
				margin: 2px 0 0;
			}
			.bar {
				position: sticky;
				top: 0;
				z-index: 2;
				background: var(--canvas);
				border-bottom: 1px solid var(--line);
				padding: 8px 0;
			}
			input[type="search"] {
				width: 100%;
				min-height: 44px;
				padding: 0 14px;
				font: inherit;
				color: var(--ink);
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 10px;
			}
			.chips {
				display: flex;
				gap: 8px;
				margin-top: 8px;
				overflow-x: auto;
				padding-bottom: 4px;
				scrollbar-width: none;
			}
			.chips::-webkit-scrollbar {
				display: none;
			}
			.chip {
				flex: none;
				min-height: 40px;
				padding: 0 14px;
				font: inherit;
				color: var(--ink);
				background: var(--chip);
				border: 1px solid transparent;
				border-radius: 999px;
				cursor: pointer;
			}
			.chip:focus-visible,
			.card:focus-visible,
			.close:focus-visible,
			input:focus-visible {
				outline: 3px solid var(--accent);
				outline-offset: 2px;
			}
			.chip[aria-pressed="true"] {
				background: var(--brand);
				color: var(--brand-ink);
				font-weight: 600;
			}
			main {
				max-width: 1100px;
				margin: 0 auto;
				padding: 8px 16px 40px;
			}
			section {
				scroll-margin-top: 110px;
			}
			h2 {
				margin: 22px 0 8px;
				font-size: 1.15rem;
				overflow-wrap: anywhere;
			}
			h3 {
				margin: 6px 0 0;
				font-size: 0.85rem;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--muted);
			}
			ul {
				list-style: none;
				margin: 0;
				padding: 0;
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 10px;
			}
			@media (min-width: 640px) {
				ul {
					grid-template-columns: repeat(3, minmax(0, 1fr));
					gap: 14px;
				}
			}
			@media (min-width: 960px) {
				ul {
					grid-template-columns: repeat(4, minmax(0, 1fr));
				}
			}
			.sub {
				grid-column: 1 / -1;
			}
			ul > li {
				display: flex;
				min-width: 0;
			}
			.card {
				display: flex;
				flex-direction: column;
				width: 100%;
				padding: 0;
				font: inherit;
				text-align: left;
				color: var(--ink);
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 14px;
				overflow: hidden;
				cursor: pointer;
			}
			.photo {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 100%;
				aspect-ratio: 4 / 3;
				object-fit: cover;
				background: var(--tile);
				color: var(--tile-ink);
				font-size: 2rem;
				font-weight: 700;
			}
			.body {
				display: flex;
				flex: 1;
				flex-direction: column;
				gap: 2px;
				padding: 10px;
			}
			.name {
				font-weight: 600;
				overflow-wrap: anywhere;
			}
			.desc {
				display: -webkit-box;
				-webkit-box-orient: vertical;
				-webkit-line-clamp: 2;
				line-clamp: 2;
				overflow: hidden;
				color: var(--muted);
				font-size: 0.85rem;
				overflow-wrap: anywhere;
			}
			.price {
				margin-top: auto;
				padding-top: 4px;
				font-weight: 700;
				overflow-wrap: anywhere;
			}
			dialog {
				width: min(440px, calc(100% - 32px));
				max-height: calc(100% - 32px);
				padding: 0;
				color: var(--ink);
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 16px;
				overflow: auto;
			}
			dialog::backdrop {
				background: rgba(0, 0, 0, 0.6);
			}
			dialog .body {
				padding: 16px;
				gap: 8px;
			}
			dialog .name {
				font-size: 1.25rem;
			}
			dialog .desc {
				display: block;
				font-size: 1rem;
				white-space: pre-line;
			}
			dialog .price {
				font-size: 1.25rem;
			}
			.close {
				position: absolute;
				top: 8px;
				right: 8px;
				width: 44px;
				height: 44px;
				font-size: 1.5rem;
				line-height: 1;
				color: var(--ink);
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 999px;
				cursor: pointer;
			}
			/* a browser without pop-ups: the cards show the whole description instead */
			.no-dialog .desc {
				display: block;
			}
			.no-dialog .card {
				cursor: default;
			}
			.note {
				padding: 40px 16px;
				text-align: center;
				color: var(--muted);
			}
			footer {
				padding: 0 16px 24px;
				text-align: center;
				font-size: 0.75rem;
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<header>
			<div class="wrap">
				<h1 id="biz">Menu</h1>
				<p class="where" id="where"></p>
			</div>
		</header>
		<div class="bar" id="bar" hidden>
			<div class="wrap">
				<input type="search" id="q" placeholder="Search the menu" aria-label="Search the menu" autocomplete="off" />
				<div class="chips" id="chips" role="group" aria-label="Menu categories"></div>
			</div>
		</div>
		<main id="menu" aria-live="polite"><p class="note">Loading the menu…</p></main>
		<footer>
			<div id="stamp"></div>
			<div>Powered by ceylonrylabs</div>
		</footer>
		<dialog id="item" aria-labelledby="item-name"></dialog>
		<script>
			(function () {
				var params = new URLSearchParams(location.search);
				var token = params.get("token") || location.pathname.split("/").pop() || "";
				// the address bar shows only the website, so the menu link is not there to copy or edit; the token is kept with this
				// history entry, and the home page sends a reload back here (see index.html)
				if (/^[A-Za-z0-9_-]{32,64}$/.test(token)) history.replaceState({ qrMenu: token }, "", "/");
				var menu = null;
				var active = "";
				var el = function (id) {
					return document.getElementById(id);
				};
				function make(tag, cls, txt) {
					var n = document.createElement(tag);
					if (cls) n.className = cls;
					if (txt != null) n.textContent = txt;
					return n;
				}
				function money(v) {
					var cur = menu.currency === "LKR" ? "LKR " : menu.currency + " ";
					return cur + Number(v || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
				}
				function note(msg) {
					var main = el("menu");
					main.replaceChildren(make("p", "note", msg));
				}
				var dlg = el("item");
				if (!dlg.showModal) document.documentElement.className = "no-dialog";
				// the item's photo, or a tile with its first letter when it has none (or the photo cannot load)
				function photo(it) {
					var tile = make("span", "photo", Array.from(it.name)[0] || "");
					tile.setAttribute("aria-hidden", "true");
					if (!it.image) return tile;
					var img = make("img", "photo");
					img.src = it.image;
					img.alt = "";
					img.loading = "lazy";
					img.referrerPolicy = "no-referrer";
					img.onerror = function () {
						img.replaceWith(tile);
					};
					return img;
				}
				function details(it) {
					var body = make("span", "body");
					body.appendChild(make("span", "name", it.name));
					if (it.description) body.appendChild(make("span", "desc", it.description));
					body.appendChild(make("span", "price", money(it.price)));
					return body;
				}
				function open(it) {
					if (!dlg.showModal) return;
					var close = make("button", "close", "\u00d7");
					close.type = "button";
					close.setAttribute("aria-label", "Close");
					close.onclick = function () {
						dlg.close();
					};
					var body = details(it);
					body.firstChild.id = "item-name";
					dlg.replaceChildren(close, photo(it), body);
					dlg.showModal();
				}
				dlg.addEventListener("click", function (e) {
					if (e.target === dlg) dlg.close(); // a tap outside the box
				});
				function render() {
					var term = el("q").value.trim().toLowerCase();
					var main = el("menu");
					main.replaceChildren();
					var shown = 0;
					menu.categories.forEach(function (cat, i) {
						if (active && active !== cat.name) return;
						var items = cat.items.filter(function (it) {
							return !term || (it.name + " " + it.description + " " + cat.name).toLowerCase().indexOf(term) !== -1;
						});
						if (!items.length) return;
						var sec = make("section");
						sec.id = "cat" + i;
						sec.appendChild(make("h2", "", cat.name));
						var list = make("ul");
						var sub = null;
						items.forEach(function (it) {
							if (it.sub && it.sub !== sub) list.appendChild(make("li", "sub")).appendChild(make("h3", "", it.sub));
							sub = it.sub;
							var card = make("button", "card");
							card.type = "button";
							card.appendChild(photo(it));
							card.appendChild(details(it));
							card.onclick = function () {
								open(it);
							};
							list.appendChild(make("li")).appendChild(card);
							shown += 1;
						});
						sec.appendChild(list);
						main.appendChild(sec);
					});
					if (!shown) note(term ? "No items match your search." : "This menu has no items yet.");
				}
				function chips() {
					var box = el("chips");
					box.replaceChildren();
					[""].concat(menu.categories.map(function (c) {
						return c.name;
					})).forEach(function (name) {
						var b = make("button", "chip", name || "All");
						b.type = "button";
						b.setAttribute("aria-pressed", String(name === active));
						b.onclick = function () {
							active = name;
							chips();
							render();
						};
						box.appendChild(b);
					});
				}
				function show(data) {
					menu = data;
					document.title = menu.business + " menu";
					el("biz").textContent = menu.business;
					el("where").textContent = menu.location;
					el("bar").hidden = false;
					if (!menu.categories.some(function (c) { return c.name === active; })) active = "";
					chips();
					render();
					var d = new Date(menu.updatedAt);
					el("stamp").textContent = isNaN(d) ? "" : "Menu updated " + d.toLocaleString();
				}
				function load() {
					if (!/^[A-Za-z0-9_-]{32,64}$/.test(token)) return note("This menu link is not valid.");
					fetch("/.netlify/functions/public-menu?token=" + encodeURIComponent(token), { cache: "no-store" })
						.then(function (r) {
							return r.json().catch(function () {
								return {};
							}).then(function (j) {
								return { ok: r.ok && j.ok, j: j };
							});
						})
						.then(function (res) {
							if (res.ok) show(res.j.menu);
							else if (!menu) note("This menu is not available right now.");
						})
						.catch(function () {
							if (!menu) note("Could not load the menu. Check your connection and try again.");
						});
				}
				el("q").addEventListener("input", function () {
					if (menu) render();
				});
				document.addEventListener("visibilitychange", function () {
					if (!document.hidden) load();
				});
				load();
			})();
		</script>
	</body>
</html>
