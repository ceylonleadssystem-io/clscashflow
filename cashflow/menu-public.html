<!doctype html>
<html lang="en">
	<head>
		<link rel="icon" type="image/png" href="/assets/favicon.png" />
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="robots" content="noindex,nofollow,noarchive" />
		<title>Menu</title>
		<style>
			:root {
				--ink: #181512;
				--muted: #6b645c;
				--line: #e2dcd2;
				--canvas: #f6f3ee;
				--card: #ffffff;
				--accent: #8a5a12;
				--chip: #ece6db;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--ink: #f2ede4;
					--muted: #a79f93;
					--line: #3a352e;
					--canvas: #151310;
					--card: #1f1c18;
					--accent: #e0b25a;
					--chip: #2b2722;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				max-width: 100%;
				background: var(--canvas);
				color: var(--ink);
				font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
				line-height: 1.4;
			}
			header {
				padding: 20px 16px 8px;
				max-width: 720px;
				margin: 0 auto;
			}
			h1 {
				margin: 0;
				font-size: 1.6rem;
				overflow-wrap: anywhere;
			}
			.where {
				margin: 2px 0 0;
				color: var(--muted);
			}
			.bar {
				position: sticky;
				top: 0;
				z-index: 2;
				background: var(--canvas);
				border-bottom: 1px solid var(--line);
				padding: 8px 0;
			}
			.bar-in {
				max-width: 720px;
				margin: 0 auto;
				padding: 0 16px;
			}
			input[type="search"] {
				width: 100%;
				min-height: 44px;
				padding: 0 14px;
				font: inherit;
				color: var(--ink);
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 10px;
			}
			.chips {
				display: flex;
				gap: 8px;
				margin-top: 8px;
				overflow-x: auto;
				padding-bottom: 4px;
				scrollbar-width: none;
			}
			.chips::-webkit-scrollbar {
				display: none;
			}
			.chip {
				flex: none;
				min-height: 40px;
				padding: 0 14px;
				font: inherit;
				color: var(--ink);
				background: var(--chip);
				border: 1px solid transparent;
				border-radius: 999px;
				cursor: pointer;
			}
			.chip:focus-visible,
			input:focus-visible {
				outline: 3px solid var(--accent);
				outline-offset: 2px;
			}
			.chip[aria-pressed="true"] {
				border-color: var(--accent);
				color: var(--accent);
				font-weight: 600;
			}
			main {
				max-width: 720px;
				margin: 0 auto;
				padding: 8px 16px 40px;
			}
			section {
				scroll-margin-top: 110px;
			}
			h2 {
				margin: 22px 0 8px;
				font-size: 1.15rem;
				overflow-wrap: anywhere;
			}
			h3 {
				margin: 14px 0 4px;
				font-size: 0.85rem;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--muted);
			}
			ul {
				list-style: none;
				margin: 0;
				padding: 0;
			}
			.item {
				display: flex;
				gap: 12px;
				padding: 12px;
				margin-bottom: 8px;
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 12px;
			}
			.item img {
				flex: none;
				width: 84px;
				height: 84px;
				object-fit: cover;
				border-radius: 8px;
				background: var(--chip);
			}
			.item .body {
				flex: 1;
				min-width: 0;
			}
			.item .name {
				font-weight: 600;
				overflow-wrap: anywhere;
			}
			.item .desc {
				margin-top: 2px;
				color: var(--muted);
				font-size: 0.9rem;
				overflow-wrap: anywhere;
			}
			.item .price {
				flex: none;
				font-weight: 600;
				white-space: nowrap;
				color: var(--accent);
			}
			.note {
				padding: 40px 16px;
				text-align: center;
				color: var(--muted);
			}
			footer {
				padding: 0 16px 24px;
				text-align: center;
				font-size: 0.75rem;
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<header>
			<h1 id="biz">Menu</h1>
			<p class="where" id="where"></p>
		</header>
		<div class="bar" id="bar" hidden>
			<div class="bar-in">
				<input type="search" id="q" placeholder="Search the menu" aria-label="Search the menu" autocomplete="off" />
				<div class="chips" id="chips" role="group" aria-label="Menu categories"></div>
			</div>
		</div>
		<main id="menu" aria-live="polite"><p class="note">Loading the menu…</p></main>
		<footer id="stamp"></footer>
		<script>
			(function () {
				var params = new URLSearchParams(location.search);
				var token = params.get("token") || location.pathname.split("/").pop() || "";
				var menu = null;
				var active = "";
				var el = function (id) {
					return document.getElementById(id);
				};
				function make(tag, cls, txt) {
					var n = document.createElement(tag);
					if (cls) n.className = cls;
					if (txt != null) n.textContent = txt;
					return n;
				}
				function money(v) {
					var cur = menu.currency === "LKR" ? "LKR " : menu.currency + " ";
					return cur + Number(v || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
				}
				function note(msg) {
					var main = el("menu");
					main.replaceChildren(make("p", "note", msg));
				}
				function render() {
					var term = el("q").value.trim().toLowerCase();
					var main = el("menu");
					main.replaceChildren();
					var shown = 0;
					menu.categories.forEach(function (cat, i) {
						if (active && active !== cat.name) return;
						var items = cat.items.filter(function (it) {
							return !term || (it.name + " " + it.description + " " + cat.name).toLowerCase().indexOf(term) !== -1;
						});
						if (!items.length) return;
						var sec = make("section");
						sec.id = "cat" + i;
						sec.appendChild(make("h2", "", cat.name));
						var list = make("ul");
						var sub = null;
						items.forEach(function (it) {
							if (it.sub && it.sub !== sub) list.appendChild(make("li", "", "")).replaceChildren(make("h3", "", it.sub));
							sub = it.sub;
							var li = make("li", "item");
							if (it.image) {
								var img = make("img");
								img.src = it.image;
								img.alt = "";
								img.loading = "lazy";
								img.referrerPolicy = "no-referrer";
								img.onerror = function () {
									img.remove();
								};
								li.appendChild(img);
							}
							var body = make("div", "body");
							body.appendChild(make("div", "name", it.name));
							if (it.description) body.appendChild(make("div", "desc", it.description));
							li.appendChild(body);
							li.appendChild(make("div", "price", money(it.price)));
							list.appendChild(li);
							shown += 1;
						});
						sec.appendChild(list);
						main.appendChild(sec);
					});
					if (!shown) note(term ? "No items match your search." : "This menu has no items yet.");
				}
				function chips() {
					var box = el("chips");
					box.replaceChildren();
					[""].concat(menu.categories.map(function (c) {
						return c.name;
					})).forEach(function (name) {
						var b = make("button", "chip", name || "All");
						b.type = "button";
						b.setAttribute("aria-pressed", String(name === active));
						b.onclick = function () {
							active = name;
							chips();
							render();
						};
						box.appendChild(b);
					});
				}
				function show(data) {
					menu = data;
					document.title = menu.business + " menu";
					el("biz").textContent = menu.business;
					el("where").textContent = menu.location;
					el("bar").hidden = false;
					if (!menu.categories.some(function (c) { return c.name === active; })) active = "";
					chips();
					render();
					var d = new Date(menu.updatedAt);
					el("stamp").textContent = isNaN(d) ? "" : "Menu updated " + d.toLocaleString();
				}
				function load() {
					if (!/^[A-Za-z0-9_-]{32,64}$/.test(token)) return note("This menu link is not valid.");
					fetch("/.netlify/functions/public-menu?token=" + encodeURIComponent(token), { cache: "no-store" })
						.then(function (r) {
							return r.json().catch(function () {
								return {};
							}).then(function (j) {
								return { ok: r.ok && j.ok, j: j };
							});
						})
						.then(function (res) {
							if (res.ok) show(res.j.menu);
							else if (!menu) note("This menu is not available right now.");
						})
						.catch(function () {
							if (!menu) note("Could not load the menu. Check your connection and try again.");
						});
				}
				el("q").addEventListener("input", function () {
					if (menu) render();
				});
				document.addEventListener("visibilitychange", function () {
					if (!document.hidden) load();
				});
				load();
			})();
		</script>
	</body>
</html>
