# /cashflow on its own has no page: send people to the landing page.
[[redirects]]
  from = "/cashflow"
  to = "/"
  status = 302

[[redirects]]
  from = "/cashflow/"
  to = "/"
  status = 302

# The legacy single-file POS is retired (archived as posv1): old links, bookmarks and installed
# shortcuts open the React POS.
[[redirects]]
  from = "/pos-system/*"
  to = "/posv2/"
  status = 302
  force = true

# POS administration portal. Must stay above the generic /posv2/* rule (first match wins).
[[redirects]]
  from = "/posv2/admin"
  to = "/pos-react/dist/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/posv2/admin/"
  to = "/pos-react/dist/admin.html"
  status = 200
  force = true

# Kitchen Display (KDS), a separate page that pairs with the POS over the local Wi-Fi.
[[redirects]]
  from = "/KDS"
  to = "/pos-react/dist/kds.html"
  status = 200
  force = true

[[redirects]]
  from = "/KDS/"
  to = "/pos-react/dist/kds.html"
  status = 200
  force = true

# Guest Manager (GM), reservations and guests that work alongside the POS (static page in /reservation-system).
[[redirects]]
  from = "/GM"
  to = "/reservation-system/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/GM/"
  to = "/reservation-system/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/posv2/kds"
  to = "/pos-react/dist/kds.html"
  status = 200
  force = true

[[redirects]]
  from = "/posv2"
  to = "/pos-react/dist/index.html"
  status = 200

[[redirects]]
  from = "/posv2/"
  to = "/pos-react/dist/index.html"
  status = 200

[[redirects]]
  from = "/posv2/*"
  to = "/pos-react/dist/:splat"
  status = 200

# Standard security headers (no restrictive CSP, so inline scripts keep working)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(self), hid=(self)"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Permitted-Cross-Domain-Policies = "none"
    Origin-Agent-Cluster = "?1"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.emailjs.com https://www.gstatic.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.cloud.appwrite.io wss://*.cloud.appwrite.io https://api.emailjs.com https://api.stripe.com; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'self'; upgrade-insecure-requests"

# Versioned application assets can stay in the browser cache between portal
# pages. Netlify purges its edge cache on each deploy, while query-string
# versions in the HTML move browsers to updated JavaScript immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, durable, max-age=31536000, immutable"

# The shared application runtime controls invoice rendering and changes often.
# Revalidate it so an older renderer cannot survive a deploy.
[[headers]]
  for = "/assets/platform.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

# Public invoice links can become available immediately after a reminder is
# created. Never retain an earlier not-found page in a mobile browser cache.
[[headers]]
  for = "/i/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/invoice/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/cashflow/invoice-public.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=300, must-revalidate"

# The POS is served under /posv2/: its manifest and service worker need the same headers there.
[[headers]]
  for = "/posv2/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/posv2/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# A short browser cache makes switching Solo, Studio, and Business feel
# immediate without leaving users on stale HTML after an update.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"
    Netlify-CDN-Cache-Control = "public, durable, max-age=3600, stale-while-revalidate=86400"

# API responses carry user data and must never be cached or framed.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Admin consoles are never framed and never cached.
[[headers]]
  for = "/cashflow/ceylonry-admin.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"


# Source, tests and internal docs live in the repo but are not part of the site.
# These paths used to be downloadable because the publish directory is the repo root.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
