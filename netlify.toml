[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/mrs-gamage-story"
  to = "/mrs-gamage-story.html"
  status = 200

[[redirects]]
  from = "/join-the-movement"
  to = "/mrs-gamage-story.html"
  status = 200

[[redirects]]
  from = "/i/:token"
  to = "/cashflow/invoice-public.html?token=:token"
  status = 200

[[redirects]]
  from = "/invoice/:token/:version"
  to = "/cashflow/invoice-public.html?token=:token&v=:version"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/install"
  to = "/app/index.html"
  status = 200

